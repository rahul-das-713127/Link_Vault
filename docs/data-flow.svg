<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
  <defs>
    <style>
      .bg { fill: #ffffff; }
      .box { fill: #ffffff; stroke: #0f172a; stroke-width: 3; rx: 16; }
      .pill { fill: #eef2ff; stroke: #4f46e5; stroke-width: 3; rx: 16; }
      .title { font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial; font-size: 26px; fill: #0f172a; font-weight: 800; }
      .h { font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial; font-size: 20px; fill: #0f172a; font-weight: 800; }
      .t { font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial; font-size: 17px; fill: #0f172a; }
      .m { fill: #334155; }
      .arrow { stroke: #0f172a; stroke-width: 3.2; fill: none; marker-end: url(#arrowHead); }
      .label { font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial; font-size: 15px; fill: #0f172a; }
    </style>
    <marker id="arrowHead" markerWidth="12" markerHeight="9" refX="12" refY="4.5" orient="auto">
      <polygon points="0 0, 12 4.5, 0 9" fill="#0f172a" />
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="1600" height="900" />

  <text class="title" x="70" y="70">LinkVault — Data Flow (Upload → Storage → Retrieval → Expiry)</text>

  <!-- Top row: User -> Frontend -> Backend -->
  <rect class="box" x="70" y="130" width="340" height="120" />
  <text class="h" x="105" y="175">User Browser</text>
  <text class="t m" x="105" y="205">Uploads text or a file</text>

  <rect class="box" x="470" y="130" width="420" height="120" />
  <text class="h" x="505" y="175">Frontend</text>
  <text class="t m" x="505" y="205">React + Vite + Tailwind</text>

  <rect class="box" x="950" y="130" width="580" height="120" />
  <text class="h" x="985" y="175">Backend API</text>
  <text class="t m" x="985" y="205">Node.js + Express</text>
  <text class="t m" x="985" y="228">POST /api/upload</text>

  <path class="arrow" d="M410 190 L470 190" />
  <text class="label" x="420" y="170">Upload</text>

  <path class="arrow" d="M890 190 L950 190" />
  <text class="label" x="895" y="155">POST /api/upload</text>

  <!-- Middle: Validation/Features under Backend -->
  <rect class="pill" x="950" y="290" width="580" height="120" />
  <text class="h" x="985" y="335">Validation + Feature Layer</text>
  <text class="t m" x="985" y="365">expiry, password, limits, one-time, type checks</text>

  <path class="arrow" d="M1240 250 L1240 290" />
  <text class="label" x="1260" y="275">Validate</text>

  <!-- Storage: DB + Disk -->
  <rect class="box" x="950" y="460" width="580" height="160" />
  <text class="h" x="985" y="505">SQLite Database</text>
  <text class="t m" x="985" y="535">backend/data/linkvault.sqlite</text>
  <text class="t m" x="985" y="560">Tables: users, shares</text>

  <rect class="box" x="470" y="460" width="420" height="160" />
  <text class="h" x="505" y="505">File Storage (Disk)</text>
  <text class="t m" x="505" y="535">backend/uploads/</text>

  <path class="arrow" d="M1240 410 L1240 460" />
  <text class="label" x="1260" y="445">Store metadata</text>

  <path class="arrow" d="M1000 410 L1000 440 L900 440 L900 520 L890 520" />
  <text class="label" x="910" y="430">Store bytes (if file)</text>

  <!-- Bottom row: Retrieval + Cleanup -->
  <rect class="box" x="70" y="680" width="820" height="170" />
  <text class="h" x="105" y="725">Retrieval Flow (Share Link)</text>
  <text class="t m" x="105" y="755">Open link: /s/:id → frontend calls backend</text>
  <text class="t m" x="105" y="780">GET /api/share/:id → JSON (text or file metadata + download URL)</text>
  <text class="t m" x="105" y="805">GET /api/share/:id/file → bytes from disk</text>

  <rect class="box" x="950" y="680" width="580" height="170" />
  <text class="h" x="985" y="725">Expiry / Cleanup</text>
  <text class="t m" x="985" y="755">Background job (every 60s) deletes expired rows</text>
  <text class="t m" x="985" y="780">Also deletes expired files from backend/uploads/</text>

  <path class="arrow" d="M890 760 L950 760" />
  <text class="label" x="900" y="740">Cleanup</text>

  <path class="arrow" d="M1240 620 L1240 680" />
  <text class="label" x="1260" y="655">Find expired</text>

  <path class="arrow" d="M950 805 L890 805" />
  <text class="label" x="900" y="830">Delete files</text>
</svg>
